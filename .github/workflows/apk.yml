name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Guardar APK no build
        uses: actions/upload-artifact@v4
        with:
          name: Aprendiz-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publicar APK em Releases (link direto para baixar no celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Aprendiz.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Aprendiz.apk \
            --title "Aprendiz — build ${{ github.run_number }}" \
            --notes "APK gerado automaticamente a partir do commit ${{ github.sha }}."
