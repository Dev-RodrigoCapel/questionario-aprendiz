name: Gerar APK e versão web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar vozes neurais (Piper, gratuitas e offline)
        uses: actions/cache@v4
        with:
          path: .vozes
          key: piper-vozes-v1

      - name: Gerar áudios das perguntas e respostas
        env:
          VOZ: pt_BR-cadu-medium
        run: |
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libopus
          pip install -q piper-tts==1.8.0
          mkdir -p .vozes
          for v in pt_BR-faber-medium pt_BR-cadu-medium pt_BR-jeff-medium; do
            [ -f .vozes/$v.onnx ] || python -m piper.download_voices --download-dir .vozes $v
          done
          MP3_DIR=site/audio python tools/gerar_audio.py www/audio
          ls www/audio | wc -l && du -sh www/audio site/audio
          # amostras para comparar vozes (vão para a página de Releases)
          export AMOSTRA="Pergunta 36. Quais são as Joias Móveis? Resposta. Esquadro, Nível e Prumo, que adornam o Venerável e os Vigilantes."
          for v in pt_BR-faber-medium pt_BR-cadu-medium pt_BR-jeff-medium; do VOZ=$v python tools/gerar_audio.py amostras; done
          ls -la amostras

      - name: Montar versão web (iPhone / navegador)
        run: python tools/montar_web.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - run: npm ci
      - run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Guardar APK no build
        uses: actions/upload-artifact@v4
        with:
          name: Aprendiz-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publicar APK em Releases (link direto para baixar no celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Aprendiz.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Aprendiz.apk amostras/*.ogg \
            --title "Aprendiz v2 — build ${{ github.run_number }}" \
            --notes "APK gerado automaticamente a partir do commit ${{ github.sha }}."

  web:
    # Publica a versão web no GitHub Pages.
    # Requer uma vez: Settings › Pages › Source = "GitHub Actions".
    needs: apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
