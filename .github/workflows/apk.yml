name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar vozes neurais (Piper, gratuitas e offline)
        uses: actions/cache@v4
        with:
          path: .vozes
          key: piper-vozes-v1

      - name: Gerar áudios das perguntas e respostas
        env:
          VOZ: pt_BR-faber-medium
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q piper-tts==1.8.0
          mkdir -p .vozes
          for v in pt_BR-faber-medium pt_BR-cadu-medium pt_BR-jeff-medium; do
            [ -f .vozes/$v.onnx ] || python -m piper.download_voices --download-dir .vozes $v
          done
          python tools/gerar_audio.py www/audio
          ls www/audio | wc -l && du -sh www/audio
          # amostras para comparar vozes (vão para a página de Releases)
          export AMOSTRA="Pergunta 36. Quais são as Joias Móveis? Resposta. Esquadro, Nível e Prumo, que adornam o Venerável e os Vigilantes."
          for v in pt_BR-faber-medium pt_BR-cadu-medium pt_BR-jeff-medium; do VOZ=$v python tools/gerar_audio.py amostras; done
          ls -la amostras

      - run: npm ci
      - run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Guardar APK no build
        uses: actions/upload-artifact@v4
        with:
          name: Aprendiz-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publicar APK em Releases (link direto para baixar no celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Aprendiz.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Aprendiz.apk amostras/*.ogg \
            --title "Aprendiz v2 — build ${{ github.run_number }}" \
            --notes "APK gerado automaticamente a partir do commit ${{ github.sha }}."
